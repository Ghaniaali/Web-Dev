<aside class="sidebar">

    <div class="sidebar-logo">
        Coachboard
    </div>

    <nav class="sidebar-nav">
     @for (item of navItems; track item.path) {

      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >

        <span class="nav-icon">
          {{ item.icon }}
        </span>

        <span class="nav-label">
          {{ item.label }}
        </span>

      </a>

    }

  </nav>

</aside>
